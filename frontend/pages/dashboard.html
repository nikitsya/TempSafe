<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Current status – TEMSAFE</title>
    <link href="../css/main.css" rel="stylesheet">
</head>
<body>
<header class="site-header">
    <nav aria-label="Main" class="nav">
        <span class="brand">TEMSAFE</span>
        <a aria-current="page" href="dashboard.html">Current status</a>
        <a href="history.html">History</a>
        <a data-signout href="../index.html">Sign out</a>
    </nav>
</header>
<main>
    <p class="banner error" hidden id="signout-error" role="alert"></p>

    <div class="top">
        <h1 class="page-title">Current status</h1>
        <span class="muted">Box TS-01</span>
    </div>

    <p class="banner error" hidden id="refresh-error" role="status"></p>

    <div id="dashboard"></div>

    <!-- Screen readers hear only status changes, not every automatic refresh. -->
    <p aria-live="polite" class="visually-hidden" id="status-announcer" role="status"></p>
    <p aria-live="assertive" class="visually-hidden" id="alert-announcer" role="alert"></p>

    <a class="btn" href="history.html">History</a>

    <p><span class="api-status down" id="api-status" role="status">Checking API…</span></p>
</main>
<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
