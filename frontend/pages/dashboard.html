<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Dashboard – TempSafe</title>
    <link href="../css/main.css?v=35" rel="stylesheet">
</head>
<body>
<header class="site-header">
    <div class="header-top">
        <span class="brand">TempSafe</span>
        <div class="header-right">
            <a class="signout-link" data-signout href="../index.html">Sign out</a>
        </div>
    </div>
    <div class="nav-bar">
        <nav aria-label="Main" class="nav">
            <a aria-current="page" href="dashboard.html">Dashboard</a>
            <a href="history.html">History</a>
            <a href="alerts.html">Alerts</a>
            <a href="settings.html">Settings</a>
        </nav>
    </div>
</header>
<main class="wide">
    <h1 class="visually-hidden">Dashboard</h1>
    <p class="banner error" hidden id="signout-error" role="alert"></p>
    <p class="banner error" hidden id="refresh-error" role="status"></p>

    <div id="alert-banner"></div>

    <div id="dashboard"></div>

    <!-- Screen readers hear only status changes, not every automatic refresh. -->
    <p aria-live="polite" class="visually-hidden" id="status-announcer" role="status"></p>
    <p aria-live="assertive" class="visually-hidden" id="alert-announcer" role="alert"></p>

    <nav aria-label="More" class="shortcuts">
        <a class="shortcut" href="history.html#graph"><span aria-hidden="true" class="shortcut-icon">↗</span>Graph</a>
        <a class="shortcut" href="history.html#readings"><span aria-hidden="true" class="shortcut-icon">☰</span>History</a>
        <a class="shortcut" href="alerts.html#issues"><span aria-hidden="true" class="shortcut-icon">⚠</span>Issues</a>
    </nav>
</main>
<script src="../js/api.js?v=35"></script>
<script src="../js/main.js?v=35"></script>
<script src="../js/notifications.js?v=35"></script>
<script src="../js/dashboard.js?v=35"></script>
</body>
</html>
