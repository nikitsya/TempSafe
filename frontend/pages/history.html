<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>History – TEMPSAFE</title>
    <link href="../css/main.css?v=3" rel="stylesheet">
</head>
<body>
<header class="site-header">
    <div class="header-top">
        <span class="brand">TEMPSAFE</span>
        <span class="box-id">Box TS-01</span>
    </div>
    <div class="nav-bar">
        <nav aria-label="Main" class="nav">
            <a href="dashboard.html">Status</a>
            <a aria-current="page" href="history.html">History</a>
            <a data-signout href="../index.html">Sign out</a>
        </nav>
    </div>
</header>
<main class="wide">
    <h1 class="visually-hidden">History of box TS-01</h1>
    <p class="banner error" hidden id="signout-error" role="alert"></p>

    <div class="history-controls">
        <section aria-labelledby="period-title" class="panel">
            <h2 class="panel-title" id="period-title">Period</h2>
            <div id="history-filter"></div>
        </section>
        <section aria-labelledby="view-title" class="panel">
            <h2 class="panel-title" id="view-title">Show</h2>
            <div id="history-views"></div>
        </section>
    </div>

    <section aria-busy="true" aria-live="polite" class="card view" id="history" tabindex="-1"></section>

    <p><span class="api-status down" id="api-status" role="status">Checking API…</span></p>
</main>
<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script src="../js/history.js"></script>
</body>
</html>
