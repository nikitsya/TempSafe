<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Sign in – TEMPSAFE</title>
    <link href="css/main.css?v=3" rel="stylesheet">
</head>
<body>
<header class="site-header">
    <div class="header-top">
        <span class="brand">TEMPSAFE</span>
    </div>
    <div aria-hidden="true" class="nav-bar nav-bar-thin"></div>
</header>
<main class="signin">
    <h1 class="signin-title">Sign in</h1>
    <p class="muted">See the temperature of your box.</p>

    <div class="banner" hidden id="signin-message" role="alert"></div>
    <form class="card" id="signin" method="post" novalidate>
        <label for="username">Email or username</label>
        <input autocomplete="username" id="username" name="username" required>
        <label for="password">Password</label>
        <input autocomplete="current-password" id="password" name="password" required type="password">
        <button class="btn" type="submit">Sign in</button>
    </form>

    <p><span class="api-status down" id="api-status" role="status">Checking API…</span></p>
</main>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/signin.js"></script>
</body>
</html>
