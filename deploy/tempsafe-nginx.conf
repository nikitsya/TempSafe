# Install this file in /etc/nginx/sites-available and enable it with a symlink.
server {
    listen 80;
    server_name tempsafe.app mqtt.tempsafe.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 308 https://tempsafe.app$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name tempsafe.app;
    ssl_certificate /etc/letsencrypt/live/tempsafe.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tempsafe.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    if ($host != tempsafe.app) { return 444; }

    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
